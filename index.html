<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Negyedéves Díjátadó · 2026 Q2 · SSLD Tassi Direkt Igazgatóság</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A3247;
  --blue:#14577A;
  --blue-d:#0C3E58;
  --blue-l:#2A86B0;
  --teal:#1FA39C;
  --coral:#E4714A;
  --gold:#D6A243;
  --gold-l:#F0C978;
  --cream:#FDF5E9;
  --cream-2:#FAEBD7;
  --sand:#F3DFC3;
  --white:#FFFDFA;
  --glass:rgba(255,255,255,.58);
  --glass-b:rgba(255,255,255,.85);
  --shadow:0 2.2cqh 6cqh -2cqh rgba(10,50,71,.28);
  --shadow-s:0 .8cqh 2.4cqh -.8cqh rgba(10,50,71,.22);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0A2434;font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center}

/* ---------- STAGE ---------- */
#stage{
  position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
  container-type:size;overflow:hidden;
  background:
    radial-gradient(120% 90% at 88% 6%, #FFF3DC 0%, rgba(255,243,220,0) 55%),
    radial-gradient(90% 80% at 4% 96%, #EAF6F3 0%, rgba(234,246,243,0) 58%),
    linear-gradient(168deg,#FDF6EC 0%,#FBEDDC 46%,#F8E4CD 100%);
  box-shadow:0 0 12vh rgba(0,0,0,.55);
}
/* ambient decor */
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:-14cqh;right:-8cqw;width:48cqh;height:48cqh;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(246,201,120,.55),rgba(246,201,120,.16) 45%,rgba(246,201,120,0) 70%);
  filter:blur(.4cqh);animation:breathe 11s ease-in-out infinite}
.blob{position:absolute;border-radius:50%;filter:blur(6cqh);opacity:.34}
.blob.b1{width:38cqh;height:38cqh;left:-9cqh;top:8cqh;background:#7FD3CD;animation:drift 21s ease-in-out infinite}
.blob.b2{width:30cqh;height:30cqh;right:12cqw;bottom:-8cqh;background:#F3A183;animation:drift 26s ease-in-out infinite reverse}
.blob.b3{width:26cqh;height:26cqh;left:42cqw;top:-10cqh;background:#8EC9E8;opacity:.26;animation:drift 30s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.82}}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(4cqh,-3cqh)}66%{transform:translate(-3cqh,4cqh)}}
.waves{position:absolute;left:0;right:0;bottom:0;height:22cqh;opacity:.5}
.waves svg{width:100%;height:100%;display:block}
.grain{position:absolute;inset:0;opacity:.32;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.35'/></svg>")}
.bubbles i{position:absolute;bottom:-6cqh;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.9),rgba(255,255,255,.12) 62%,rgba(255,255,255,0));border:.14cqh solid rgba(255,255,255,.5);animation:float linear infinite}
@keyframes float{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-118cqh) translateX(4cqh);opacity:0}}

/* ---------- SLIDES ---------- */
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:6.5cqh 7cqw 9cqh;z-index:2}
.slide.active{display:flex}
.slide.active .an{animation:rise .72s cubic-bezier(.19,1,.28,1) both;animation-delay:calc(var(--i,0)*65ms + 60ms)}
.slide.active .pop{animation:pop .8s cubic-bezier(.19,1.14,.3,1) both;animation-delay:calc(var(--i,0)*90ms + 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(3.2cqh)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(3cqh) scale(.93)}to{opacity:1;transform:none}}

/* header bits */
.slide-head{display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw;margin-bottom:4.6cqh}
h2.title{font-family:var(--serif);font-weight:700;font-size:7.4cqh;line-height:1.02;color:var(--ink);letter-spacing:-.015em}
h2.title .thin{font-family:var(--sans);font-weight:300;color:var(--blue-l);display:block;font-size:2.5cqh;letter-spacing:.34em;text-transform:uppercase;margin-bottom:1.5cqh}
.tier{display:inline-flex;align-items:center;gap:1.1cqh;flex:none;padding:1.5cqh 3cqh;border-radius:999px;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-l) 100%);color:#fff;
  font-weight:700;font-size:3.4cqh;letter-spacing:.02em;box-shadow:var(--shadow-s);white-space:nowrap}
.tier.g{background:linear-gradient(135deg,#C08324,#E9BE72)}
.tier.s{background:linear-gradient(135deg,#68767F,#AFBCC5)}
.tier.t{background:linear-gradient(135deg,#12817C,#3FB8B0)}
.tier-sub{display:inline-grid;place-items:center;flex:none;width:6.4cqh;height:6.4cqh;border-radius:50%;
  background:var(--glass-b);border:.2cqh solid rgba(255,255,255,.95);box-shadow:var(--shadow-s);
  font-family:var(--serif);font-weight:700;font-size:2.6cqh;color:var(--blue)}
.head-r{display:flex;align-items:center;gap:1.4cqh;flex:none}

/* name chip grid */
.names{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqh 4cqw;align-content:center;flex:1;padding-bottom:2cqh}
.names.three{grid-template-columns:1fr 1fr 1fr;gap:2cqh 2.4cqw}
.chip{display:flex;align-items:center;gap:2.2cqh;padding:2.5cqh 3cqh;border-radius:2.2cqh;
  background:var(--glass);border:.16cqh solid rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:var(--shadow-s)}
.chip .dot{flex:none;width:4.4cqh;height:4.4cqh;border-radius:50%;position:relative;
  background:conic-gradient(from 220deg,var(--gold-l),var(--coral),var(--gold-l));
  display:grid;place-items:center;box-shadow:0 .4cqh 1cqh rgba(228,113,74,.32)}
.chip .dot::after{content:'';width:1.7cqh;height:1.7cqh;border-radius:50%;background:var(--cream)}
.chip span{font-family:var(--serif);font-weight:700;font-size:3.5cqh;color:var(--ink);line-height:1.15}
.names.three .chip span{font-size:2.75cqh}
.names.three .chip{gap:1.5cqh;padding:1.7cqh 2cqh}
.names.three .chip .dot{width:3.6cqh;height:3.6cqh}
.names.three .chip .dot::after{width:1.4cqh;height:1.4cqh}

/* ---------- PODIUM ---------- */
.podium{flex:1;display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:3.6cqw;padding-bottom:2cqh}
.pcard{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.pcard.win{padding-bottom:6.5cqh}
.pcard .ring{position:relative;width:100%;aspect-ratio:1;max-width:27cqh;border-radius:50%;padding:.85cqh;
  background:linear-gradient(150deg,#DDE9EF,#fff 44%,var(--blue-l));box-shadow:var(--shadow)}
.pcard.win .ring{max-width:34cqh;background:linear-gradient(150deg,#F3CB80,#FFF6E4 38%,#C08324);
  box-shadow:0 2.6cqh 7cqh -2cqh rgba(192,131,36,.42), 0 0 0 1.6cqh rgba(240,201,120,.16)}
.pcard.third .ring{background:linear-gradient(150deg,#EBD6C4,#fff 44%,#C08A5C)}
.pcard .ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:var(--sand)}
.medal{position:absolute;bottom:-1.2cqh;left:50%;transform:translateX(-50%);z-index:3;
  width:5.4cqh;height:5.4cqh;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:2.9cqh;color:#fff;line-height:1;
  background:linear-gradient(140deg,#68767F,#B9C4CC);box-shadow:0 .7cqh 1.8cqh rgba(10,50,71,.3);
  border:.34cqh solid var(--cream)}
.pcard.win .medal{background:linear-gradient(140deg,#B87C1E,#F3CB80);width:6.6cqh;height:6.6cqh;font-size:3.5cqh}
.pcard.third .medal{background:linear-gradient(140deg,#9C6537,#D6A277)}
.pcard .nm{margin-top:3.2cqh;font-family:var(--serif);font-weight:700;font-size:3cqh;color:var(--ink);line-height:1.14;
  min-height:6.8cqh;display:flex;align-items:center;justify-content:center;padding:0 .4cqw}
.pcard.win .nm{font-size:3.7cqh;margin-top:3.6cqh}
.pcard .val{margin-top:.4cqh;display:flex;align-items:baseline;gap:.7cqh;justify-content:center;
  font-weight:800;font-size:5cqh;color:var(--blue);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pcard.win .val{font-size:6.8cqh;background:linear-gradient(120deg,var(--blue-d),var(--blue-l) 70%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.pcard .val u{text-decoration:none;font-size:2.1cqh;font-weight:600;color:var(--blue-l);letter-spacing:.14em}

/* ---------- SPOTLIGHT ---------- */
.eyebrow-tl{position:absolute;top:6.5cqh;left:7cqw;font-size:2.1cqh;letter-spacing:.4em;text-transform:uppercase;
  color:var(--blue-l);font-weight:500;z-index:4}
.spot{flex:1;display:grid;grid-template-columns:.85fr 1.15fr;align-items:center;gap:5cqw;margin-top:2cqh}
.spot .photo{position:relative;justify-self:center;width:100%;max-width:40cqh;aspect-ratio:1}
.spot .photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:var(--shadow);
  border:1cqh solid rgba(255,255,255,.92)}
.spot .photo::before,.spot .photo::after{content:'';position:absolute;inset:-3.2cqh;border-radius:50%;
  border:.24cqh dashed rgba(20,87,122,.28);animation:spin 46s linear infinite}
.spot .photo::after{inset:-6.4cqh;border-style:solid;border-color:rgba(214,162,67,.32);animation-duration:70s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.spot .txt .kicker{display:inline-flex;align-items:center;gap:1.2cqh;padding:1.3cqh 2.8cqh;border-radius:999px;
  background:var(--glass-b);border:.16cqh solid rgba(255,255,255,.95);box-shadow:var(--shadow-s);
  font-weight:600;font-size:2.3cqh;color:var(--blue);letter-spacing:.16em;text-transform:uppercase}
.spot .txt .kicker.g{background:linear-gradient(135deg,#C08324,#E9BE72);color:#fff;border-color:rgba(255,255,255,.5)}
.spot .txt .kicker.s{background:linear-gradient(135deg,#68767F,#AFBCC5);color:#fff;border-color:rgba(255,255,255,.5)}
.spot .txt .big{font-family:var(--serif);font-weight:900;font-size:10cqh;line-height:.96;letter-spacing:-.025em;
  margin:2.6cqh 0 1.2cqh;background:linear-gradient(112deg,var(--blue-d) 8%,var(--blue-l) 62%,var(--teal));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.spot .txt .name{font-family:var(--serif);font-weight:700;font-size:6.6cqh;color:var(--ink);line-height:1.04;letter-spacing:-.015em}
.spot .txt .sub{margin-top:2cqh;font-size:2.5cqh;color:#5A7688;font-weight:400;max-width:40cqw;letter-spacing:.02em}
.spot.solo{grid-template-columns:1fr;text-align:center;place-items:center}
.spot.solo .txt .sub{margin-inline:auto}
.spot.solo .txt{position:relative}
.spot.solo .txt::before{content:'';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:56cqh;height:56cqh;border-radius:50%;border:.24cqh solid rgba(20,87,122,.14);
  box-shadow:0 0 0 6cqh rgba(255,255,255,.28) inset;pointer-events:none}
.spot.solo .txt .big{font-size:16cqh}
.spot.solo .txt .name{font-size:8cqh}

/* ---------- SECTION DIVIDER ---------- */
.divider{flex:1;display:grid;place-items:center;text-align:center}
.divider .eyebrow{font-size:2.6cqh;letter-spacing:.5em;text-transform:uppercase;color:var(--blue-l);font-weight:400;margin-bottom:2.4cqh}
.divider h1{font-family:var(--serif);font-weight:900;font-size:13cqh;line-height:.96;letter-spacing:-.025em;color:var(--ink)}
.divider h1 em{font-style:italic;background:linear-gradient(115deg,var(--coral),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.divider .rule{width:14cqw;height:.34cqh;margin:3.4cqh auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.stats{display:flex;gap:2.2cqw;justify-content:center;margin-top:4.6cqh;flex-wrap:wrap}
.stat{min-width:15cqh;padding:2.6cqh 3cqh;border-radius:2.6cqh;background:var(--glass);backdrop-filter:blur(8px);
  border:.16cqh solid rgba(255,255,255,.92);box-shadow:var(--shadow-s)}
.stat b{display:block;font-weight:800;font-size:5.6cqh;letter-spacing:-.02em;
  background:linear-gradient(120deg,var(--blue-d),var(--blue-l));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{display:block;margin-top:.5cqh;font-size:1.9cqh;color:#5A7688;letter-spacing:.16em;text-transform:uppercase;font-weight:500}

/* ---------- COVER ---------- */
.cover{flex:1;display:grid;place-items:center;text-align:center}
.cover .badge{display:inline-flex;align-items:center;gap:1.4cqh;padding:1.3cqh 3cqh;border-radius:999px;
  background:var(--glass-b);border:.16cqh solid #fff;box-shadow:var(--shadow-s);
  font-weight:600;letter-spacing:.36em;text-transform:uppercase;font-size:2.1cqh;color:var(--blue)}
.cover h1{font-family:var(--serif);font-weight:900;font-size:14.5cqh;line-height:.92;letter-spacing:-.03em;color:var(--ink);margin:3cqh 0 0}
.cover h1 em{display:block;font-style:italic;background:linear-gradient(108deg,var(--blue) 4%,var(--blue-l) 46%,var(--teal) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cover .org{margin-top:3cqh;font-size:2.5cqh;letter-spacing:.4em;text-transform:uppercase;color:#5A7688;font-weight:500}
.ovb{display:flex;align-items:center;justify-content:center;gap:1cqh;margin-top:4cqh}
.ovb .ovb-img{height:11cqh;width:auto;display:block}

/* ---------- FINALE ---------- */
.finale{flex:1;display:grid;place-items:center;text-align:center}
.finale .badge{display:inline-flex;align-items:center;gap:1.4cqh;padding:1.3cqh 3cqh;border-radius:999px;
  background:var(--glass-b);border:.16cqh solid #fff;box-shadow:var(--shadow-s);
  font-weight:600;letter-spacing:.36em;text-transform:uppercase;font-size:2.1cqh;color:var(--blue)}
.finale h1{margin-top:3cqh}
.finale h1{font-family:var(--serif);font-weight:900;font-size:15cqh;line-height:1.0;letter-spacing:-.03em;
  background:linear-gradient(110deg,var(--blue-d),var(--blue-l) 45%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.finale p{margin-top:3cqh;font-size:3cqh;color:#5A7688;letter-spacing:.28em;text-transform:uppercase}

/* ---------- CHROME ---------- */
.brandmark{position:absolute;top:4.4cqh;right:5cqw;z-index:5;opacity:.9;transition:opacity .4s}
.brandmark .ovb-img{height:6.6cqh;width:auto;display:block}
.footer{position:absolute;left:7cqw;bottom:3.2cqh;display:flex;align-items:center;gap:2cqh;
  font-size:1.75cqh;color:#8098A6;letter-spacing:.18em;text-transform:uppercase;z-index:5;font-weight:500;transition:opacity .4s}
.footer .sep{width:.5cqh;height:.5cqh;border-radius:50%;background:var(--gold);opacity:.8}
.footer #fR{font-variant-numeric:tabular-nums;color:var(--blue-l);font-weight:600}
.progress{position:absolute;left:0;bottom:0;height:.55cqh;background:linear-gradient(90deg,var(--teal),var(--blue-l),var(--gold));z-index:6;transition:width .45s cubic-bezier(.19,1,.28,1);border-radius:0 999px 999px 0}
.nav{position:absolute;right:5cqw;bottom:2.6cqh;display:flex;gap:1.2cqh;z-index:7}
.nav button{width:5.4cqh;height:5.4cqh;border-radius:50%;border:.16cqh solid rgba(20,87,122,.22);background:var(--glass-b);
  color:var(--blue);cursor:pointer;display:grid;place-items:center;transition:.22s;backdrop-filter:blur(6px);box-shadow:var(--shadow-s)}
.nav button:hover{background:var(--blue);color:#fff;transform:translateY(-.4cqh)}
.nav button svg{width:2.2cqh;height:2.2cqh;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* overview */
#ov{position:absolute;inset:0;z-index:30;background:rgba(10,50,71,.94);backdrop-filter:blur(10px);display:none;
  padding:5cqh 5cqw;overflow:auto}
#ov.on{display:block}
#ov h3{color:#fff;font-family:var(--serif);font-size:4cqh;margin-bottom:3cqh;font-weight:700}
#ovg{display:grid;grid-template-columns:repeat(6,1fr);gap:1.6cqh}
.ovi{padding:1.6cqh;border-radius:1.4cqh;background:rgba(255,255,255,.08);border:.16cqh solid rgba(255,255,255,.14);
  color:#E7F1F6;cursor:pointer;transition:.18s;font-size:1.7cqh;line-height:1.3}
.ovi:hover{background:rgba(255,255,255,.2);transform:translateY(-.4cqh)}
.ovi b{display:block;color:var(--gold-l);font-size:1.5cqh;margin-bottom:.5cqh;letter-spacing:.1em}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:3.2cqh;z-index:7;font-size:1.6cqh;color:#93A9B5;
  letter-spacing:.14em;text-transform:uppercase;transition:opacity .8s;pointer-events:none}
.hint.off{opacity:0}
@media (max-width:820px){.hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <div class="decor">
    <div class="sun"></div>
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="bubbles" id="bub"></div>
    <div class="waves">
      <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
        <path d="M0,120 C220,190 380,50 620,96 C860,142 1020,196 1240,140 C1330,117 1390,96 1440,88 L1440,220 L0,220 Z" fill="rgba(31,163,156,.16)"/>
        <path d="M0,152 C240,206 420,110 660,140 C900,170 1080,214 1440,150 L1440,220 L0,220 Z" fill="rgba(20,87,122,.14)"/>
        <path d="M0,186 C260,224 520,166 780,182 C1040,198 1240,222 1440,196 L1440,220 L0,220 Z" fill="rgba(214,162,67,.16)"/>
      </svg>
    </div>
    <div class="grain"></div>
  </div>

  <div class="brandmark" id="bm"></div>
  <div id="deck"></div>
  <div class="footer"><span id="fL">SSLD Tassi Direkt Igazgatóság</span><i class="sep"></i><span id="fR"></span></div>
  <div class="progress" id="pg" style="width:0"></div>
  <div class="hint">← → lapozás · O áttekintés</div>
  <div class="nav">
    <button id="prev" aria-label="Előző"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button id="grid" aria-label="Áttekintés"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
    <button id="next" aria-label="Következő"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div id="ov"><h3>Áttekintés</h3><div id="ovg"></div></div>

/* ============ RENDER ============ */
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const img = k => PHOTOS[k] || '';

function render(d,i){
  const a = (n)=>`style="--i:${n}"`;
  if(d.t==='cover') return `<div class="cover">
      <div>
        <div class="badge an" ${a(0)}>2026 · Q2</div>
        <h1 class="an" ${a(1)}>Negyedéves<em>Díjátadó</em></h1>
        <div class="ovb an" ${a(3)}>${LOGO()}</div>
        <div class="org an" ${a(4)}>SSLD Tassi Direkt Igazgatóság</div>
      </div></div>`;

  if(d.t==='divider') return `<div class="divider"><div>
      <div class="eyebrow an" ${a(0)}>${esc(d.eyebrow)}</div>
      <h1 class="an" ${a(1)}>${d.h}</h1>
      <div class="rule an" ${a(2)}></div>
      <div class="stats">${(d.stats||[]).map((s,n)=>`<div class="stat pop" style="--i:${n+3}"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('')}</div>
    </div></div>`;

  if(d.t==='list') return `
    <div class="slide-head">
      <h2 class="title an" ${a(0)}><span class="thin">${esc(d.eyebrow||'Q2 · 2026')}</span>${esc(d.title)}</h2>
      <div class="head-r an" ${a(1)}>
        ${d.sub?`<div class="tier-sub">${esc(d.sub)}</div>`:''}
        <div class="tier ${d.cls||''}">${esc(d.tier)}</div>
      </div>
    </div>
    <div class="names ${d.cols===3?'three':''}">
      ${d.names.map((n,k)=>`<div class="chip pop" style="--i:${k+2}"><div class="dot"></div><span>${esc(n)}</span></div>`).join('')}
    </div>`;

  if(d.t==='podium'){
    const card=(p,cls,rank)=>`<div class="pcard ${cls} pop" style="--i:${rank===1?4:(rank===2?2:3)}">
        <div class="ring"><img src="${img(p[0])}" alt="${esc(p[1])}"><div class="medal">${rank}</div></div>
        <div class="nm">${esc(p[1])}</div>
        <div class="val">${esc(p[2])}<u>${esc(d.unit)}</u></div>
      </div>`;
    return `<div class="slide-head">
        <h2 class="title an" ${a(0)}><span class="thin">Dobogó · Q2 2026</span>${esc(d.title)}</h2>
        <div class="head-r an" ${a(1)}>
          ${d.note?`<div class="tier t" style="font-size:2.4cqh;padding:1.3cqh 2.4cqh">${esc(d.note)}</div>`:''}
          <div class="tier g">TOP 3</div>
        </div>
      </div>
      <div class="podium">${card(d.s,'second',2)}${card(d.w,'win',1)}${card(d.th,'third',3)}</div>`;
  }

  if(d.t==='spot'){
    const photo = d.photo? `<div class="photo pop" style="--i:1"><img src="${img(d.photo)}" alt="${esc(d.name)}"></div>`:'';
    return `${d.section?`<div class="eyebrow-tl an" ${a(0)}>${esc(d.section)}</div>`:''}
      <div class="spot ${d.solo?'solo':''}">
        ${photo}
        <div class="txt">
          <div class="kicker ${d.cls||''} an" ${a(0)}>${esc(d.kicker)}</div>
          <div class="big an" ${a(1)}>${esc(d.big)}</div>
          <div class="name an" ${a(2)}>${esc(d.name)}</div>
          ${d.sub?`<div class="sub an" ${a(3)}>${esc(d.sub)}</div>`:''}
        </div>
      </div>`;
  }

  if(d.t==='finale') return `<div class="finale"><div>
      <div class="badge an" ${a(0)}>Köszönjük a negyedévet</div>
      <h1 class="an" ${a(1)}>Medence<br>Party</h1>
      <p class="an" ${a(2)}>Nyár · Csapat · Ünneplés</p>
    </div></div>`;
  return '';
}

const label = d => d.t==='cover'?'Címlap' : d.t==='finale'?'Medence Party'
  : d.t==='divider'? d.h.replace(/<[^>]+>/g,'')
  : d.t==='list'? `${d.title} · ${d.tier}${d.sub?' '+d.sub:''}`
  : d.t==='podium'? d.title
  : `${d.big} · ${d.name}`;

const deck = document.getElementById('deck');
deck.innerHTML = S.map((d,i)=>`<section class="slide" data-i="${i}">${render(d,i)}</section>`).join('');
const slides = [...deck.querySelectorAll('.slide')];

document.getElementById('ovg').innerHTML = S.map((d,i)=>
  `<div class="ovi" data-go="${i}"><b>${String(i+1).padStart(2,'0')}</b>${esc(label(d))}</div>`).join('');

let cur = -1;
function go(n){
  n = Math.max(0, Math.min(S.length-1, n));
  if(n===cur) return;
  if(cur>=0) slides[cur].classList.remove('active');
  cur = n;
  const s = slides[cur];
  s.classList.remove('active'); void s.offsetWidth; s.classList.add('active');
  document.getElementById('pg').style.width = ((cur+1)/S.length*100)+'%';
  document.getElementById('fR').textContent = `${String(cur+1).padStart(2,'0')} / ${S.length}`;
  const hide = S[cur].t==='cover' || S[cur].t==='finale';
  document.getElementById('bm').style.opacity = hide?0:.9;
  document.querySelector('.footer').style.opacity = hide?0:1;
  location.hash = cur+1;
  clearTimeout(window._ht);
  const h=document.querySelector('.hint'); h.classList.remove('off');
  window._ht=setTimeout(()=>h.classList.add('off'),4500);
}
document.getElementById('bm').innerHTML = LOGO();

document.getElementById('next').onclick = ()=>go(cur+1);
document.getElementById('prev').onclick = ()=>go(cur-1);
const ov = document.getElementById('ov');
document.getElementById('grid').onclick = ()=>ov.classList.toggle('on');
ov.addEventListener('click', e=>{const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go); ov.classList.remove('on');}});

addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(S.length-1);
  else if(e.key.toLowerCase()==='o')ov.classList.toggle('on');
  else if(e.key==='Escape')ov.classList.remove('on');
  else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
});
let tx=0; addEventListener('touchstart',e=>tx=e.changedTouches[0].clientX,{passive:true});
addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>50) go(cur + (d<0?1:-1));},{passive:true});

/* bubbles */
const bub=document.getElementById('bub');
for(let i=0;i<14;i++){
  const b=document.createElement('i');
  const s=(Math.random()*2.4+0.8);
  b.style.cssText=`left:${Math.random()*100}%;width:${s}cqh;height:${s}cqh;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*22}s`;
  bub.appendChild(b);
}

go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
</script>
